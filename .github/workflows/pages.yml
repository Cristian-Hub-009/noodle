# Publishes the website (site/ plus the app's figures) to GitHub Pages on every push to main
# that touches it. One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'app/Resources/figures/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: OUT="$RUNNER_TEMP/site" scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
