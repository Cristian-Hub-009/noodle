# Push a tag like v0.2.0 to build a universal Noodle.app, attach Noodle.zip to a GitHub
# Release, and (when the TAP_TOKEN secret is set) bump the cask in pcybriwsky/homebrew-tap.
#
# With the signing secrets set, the app is signed with your Developer ID, notarized by Apple and
# stapled, so it opens without the "Open Anyway" step. Without them it falls back to ad-hoc signing.
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password you exported it with
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           your App Store Connect issuer ID
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Each secret is only handed to the step that needs it.
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME isn't vX.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [[ -n "$ID" ]] || { echo "DEVELOPER_ID_P12 has no Developer ID Application identity"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build Noodle.app
        run: |
          ARCHS="arm64 x86_64" OUT="$RUNNER_TEMP/out" scripts/build-app.sh
          lipo -info "$RUNNER_TEMP/out/Noodle.app/Contents/MacOS/ClaudePosture"
          codesign -dv "$RUNNER_TEMP/out/Noodle.app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Signature|flags)" || true

      - name: Zip
        working-directory: ${{ runner.temp }}/out
        run: ditto -c -k --sequesterRsrc --keepParent Noodle.app Noodle.zip

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ runner.temp }}/out
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit Noodle.zip "${AUTH[@]}" --wait --timeout 30m --output-format json | tee notary.json
          if [[ "$(jq -r .status notary.json)" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id notary.json)" "${AUTH[@]}" || true
            exit 1
          fi
          # Staple the ticket so it opens offline too, then re-zip the stapled app.
          xcrun stapler staple Noodle.app
          spctl --assess --type execute -vv Noodle.app
          rm Noodle.zip notary.json
          ditto -c -k --sequesterRsrc --keepParent Noodle.app Noodle.zip

      - name: Checksum
        working-directory: ${{ runner.temp }}/out
        run: shasum -a 256 Noodle.zip | tee Noodle.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/out/Noodle.zip" "$RUNNER_TEMP/out/Noodle.zip.sha256" \
            --title "Noodle $VERSION" --generate-notes --verify-tag

      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/out/Noodle.zip.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/pcybriwsky/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            packaging/homebrew/noodle.rb > "$RUNNER_TEMP/tap/Casks/noodle.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/noodle.rb
          git diff --cached --quiet || { git commit -m "noodle $VERSION"; git push; }

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
